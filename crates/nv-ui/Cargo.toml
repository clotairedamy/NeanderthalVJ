[package]
name = "nv-ui"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

[lib]
name = "nv_ui"
path = "src/lib.rs"

[[bin]]
name = "neanderthalvj"
path = "src/main.rs"

[dependencies]
nv-audio = { path = "../nv-audio" }
nv-dsp = { path = "../nv-dsp" }
nv-engine = { path = "../nv-engine" }
nv-render = { path = "../nv-render" }
nv-export = { path = "../nv-export" }
wgpu = { version = "22", features = ["wgsl"] }
pollster = "0.3"
rfd = "0.15"
tokio = { version = "1", features = ["time"] }
ads = { path = "../ads" }
dioxus = { version = "=0.7.9", features = ["desktop"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
midir = "0.10"

[features]
# Syphon output on a Mac: `cargo run --release -p nv-ui --features syphon`.
# Optional, because Syphon is compiled from source and that needs full Xcode
# with its Metal Toolchain, not just the Command Line Tools the normal
# build needs.
syphon = ["dep:syphon-rs", "dep:metal", "dep:objc2", "dep:objc2-metal"]

[target.'cfg(target_os = "macos")'.dependencies]
syphon-rs = { version = "0.2", features = ["vendored"], optional = true }
metal = { version = "0.29", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", features = ["MTLTexture"], optional = true }

[[example]]
name = "syphon_check"
required-features = ["syphon"]

[dev-dependencies]
dioxus-ssr = "=0.7.9"
