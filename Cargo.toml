[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Clotaire Damy"]
description = "An audio-reactive 3D visualizer and VJ tool"

[workspace.dependencies]
cpal = "0.15"
symphonia = "0.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
